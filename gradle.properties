# Gradle
org.gradle.daemon                    = true
org.gradle.jvmargs                   = -Xmx4G
org.gradle.parallel                  = true
org.gradle.caching                   = true

# Common
java_version                         = 25
hytale_version                       = 0.7.4
server_version                       = 0.7.4
manifestServerVersion                = >=0.7.0 <0.8.0
patchline                            = release

# Publishing
modtale_project_id                   = your-modtale-project-id
curseforge_project_id                = 123456
curseforgeID                         = 
modifold_project_slug                = your-modifold-project-slug

# Mod options
group                                = com.pseudoelephant.arcanerelay
manifest_group                       = com.pseudoelephant
mod_name                             = Arcane Relay
main_class                           = com.pseudoelephant.arcanerelay.ArcaneRelayPlugin
mod_author                           = PseudoAle,Fanzy
mod_id                               = arcanerelay
mod_license                          = MIT
mod_description                      = Arcane Relay allows you to create and play with a magical automation and logic system in Hytale.
mod_url                              = https://github.com/PseudoElephant/ArcaneRelay
version                              = 1.3.6
includes_pack                        = true
inject_server_javadocs_into_sources  = true
generateAssetsBinary                 = true
disabled_by_default                  = false
manifest_dependencies                = Hytale:AssetModule=*,Hytale:EntityModule=*
manifest_opt_dependencies            =